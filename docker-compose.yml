# Local Microsoft Entra ID emulator (https://github.com/cmaneu/entra-local) for development.
# DEV ONLY: open admin portal, seeded public passwords, self-signed TLS. Never expose it beyond localhost.
#
#   docker compose up -d
#   Portal / issuer: https://localhost:8443   (accept the self-signed certificate once in your browser)
#   Seeded users:    alice@entralocal.dev / Password1!   bob@entralocal.dev / Password1!
#
# The TLS certificate is written to ./.entra-local-data/tls/cert.pem; the auth service trusts it via
# ENTRA_CA_CERT_PATH (see auth-service/.env.example).
services:
  entra-local:
    image: ghcr.io/cmaneu/entra-local:latest
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./.entra-local-data:/app/data
    environment:
      # Issuer, authorize, token and JWKS all on https://localhost:8443 (what the web app and auth service expect).
      ORIGIN_MODE: compat
      TENANT_ID: 11111111-1111-1111-1111-111111111111
      SEED_ON_START: 'true'
      REQUIRE_PASSWORD: 'true'
